spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ecommerce
    username: ecommerce
    password: ecommerce
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379

